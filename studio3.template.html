<!doctype html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#0e0f12"><title>Кадр 3.0 — студия</title><style>__FONT__ __CSS__</style></head><body><div class="shell"><header><b>Кадр 3.0</b><span class="badge">EDL · локально в браузере</span></header><div class="grid"><section class="panel"><label>Видео<input id="file" type="file" accept="video/*,.mov,.mp4,.webm,.mkv"></label><div class="row"><label>Начало, сек<input id="in" type="number" min="0" step="0.1" value="0"></label><label>Конец, сек<input id="out" type="number" min="0.2" step="0.1" value="30"></label></div><div class="row"><label>Язык речи<select id="language"><option value="russian">Русский</option><option value="english">Английский</option><option value="auto">Определить</option></select></label><label>&nbsp;<button id="asr">Распознать речь</button></label></div><input id="srt" type="file" accept=".srt,text/plain" hidden><button id="srt-load" class="small">Загрузить SRT</button><label>Фразы, каждую с новой строки<textarea id="words" placeholder="Маленький перерыв&#10;Для больших идей">Маленький перерыв
