<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#08090c">
  <meta name="description" content="Кадр 3.0 — локальная студия монтажа разговорных видео.">
  <title>Кадр 3.0 — студия</title>
  <link rel="icon" href="./icons/icon-192.png" sizes="192x192">
  <link rel="manifest" href="./manifest.webmanifest">
  <style>__FONT__ __CSS__</style>
</head>
<body>
  <div class="shell">
    <header>
      <span class="brandmark">К</span>
      <b>Кадр</b>
      <span class="badge">Студия 3.0 · локально в браузере</span>
      <a class="badge badge-icon" href="https://github.com/IslamMol/kadr-web/releases/latest/download/kadr-desktop.zip"><span data-icon="download"></span> Windows</a>
    </header>

    <div class="grid">
      <section class="panel">
        <label class="field-title"><span data-icon="upload"></span> Видео<input id="file" type="file" accept="video/*,.mov,.mp4,.webm,.mkv"></label>

        <div class="row">
          <label>Начало, сек<input id="in" type="number" min="0" step="0.1" value="0"></label>
          <label>Конец, сек<input id="out" type="number" min="0.2" step="0.1" value="30"></label>
        </div>

        <div class="row">
          <label>Язык речи
            <select id="language">
              <option value="russian">Русский</option>
              <option value="english">Английский</option>
              <option value="auto">Определить</option>
            </select>
          </label>
          <label class="action-label">&nbsp;<button id="asr"><span data-icon="mic"></span> Распознать речь</button></label>
        </div>

        <input id="srt" type="file" accept=".srt,text/plain" hidden>
        <button id="srt-load" class="small wide"><span data-icon="file"></span> Загрузить SRT</button>

        <label>Фразы, каждую с новой строки<textarea id="words" placeholder="Маленький перерыв&#10;Для больших идей">Маленький перерыв
Для больших идей</textarea></label>

        <div id="cues" class="cue-list"></div>

        <div>
          <p class="hint"><span data-icon="layers"></span> Сцены на таймлайне — перетащи плашку мышью</p>
          <div id="timeline" class="timeline"><span class="playhead"></span></div>
          <div id="scenes" class="scene-list"></div>
          <button id="add-scene" class="small wide"><span data-icon="plus"></span> Добавить сцену на текущем кадре</button>
        </div>

        <div>
          <p class="hint"><span data-icon="sparkles"></span> Шаблон монтажа — субтитры, сцены, движение и цвет вместе</p>
          <div id="filters" class="filters"></div>
          <div id="templates" class="cards"></div>
        </div>

        <div>
          <p class="hint"><span data-icon="eye"></span> Готовые примеры на встроенном видео</p>
          <div id="examples" class="cards"></div>
        </div>

        <button id="build"><span data-icon="layers"></span> Собрать проект</button>
        <div class="row">
          <button id="save-project" class="small"><span data-icon="save"></span> Сохранить .kadr3</button>
          <button id="open-project" class="small"><span data-icon="folder"></span> Открыть .kadr3</button>
        </div>

        <input id="project-file" type="file" accept=".kadr3,application/octet-stream" hidden>

        <details id="approval-box" class="advanced-box">
          <summary>Лист проверки перед сборкой</summary>
          <div id="approval-list"></div>
          <div id="approval-warnings"></div>
        </details>

        <label class="voice-consent"><input id="approved" type="checkbox"><span>Я просмотрел(а) склейки и сцены из листа проверки.</span></label>

        <button id="export" class="primary"><span data-icon="sparkles"></span> Собрать MP4</button>
        <a id="download" class="download"><span data-icon="download"></span> Скачать MP4</a>
        <div id="progress" class="progress"><span></span></div>
        <p id="status" class="status"></p>
      </section>

      <section class="stage">
        <canvas id="canvas" width="1080" height="1920"></canvas>
        <div class="transport">
          <button id="play" class="small"><span data-icon="play"></span> Играть</button>
          <input id="range" type="range" min="0" max="6" step="0.01" value="0" aria-label="Позиция воспроизведения">
        </div>
        <span id="time" class="hint time-readout"></span>
      </section>
    </div>
  </div>
  <script>__JS__</script>
</body>
</html>
